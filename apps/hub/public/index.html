<!doctype html>
<html lang="en-AU">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>moniqr</title>
  <style>
    :root { --bg: #f6f5f2; --fg: #1c1b19; --muted: #6b6862; }

      :root { --bg: #141413; --fg: #ecebe7; --muted: #9a978f; }
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; }
    h1 { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.03em; }
    p { color: var(--muted); margin-top: 0.25rem; }
